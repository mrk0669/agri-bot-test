[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agribot"
version = "1.0.0"
description = "Autonomous Precision Robot for Sustainable Smart Agriculture - Robofest Gujarat 6.0, Track (f)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Team VNIT Nagpur" }]
dependencies = [
    "numpy>=1.21",
    "opencv-python>=4.5",
    "PyYAML>=5.4",
    "pyserial>=3.5",
]

[project.optional-dependencies]
sim = ["scipy>=1.7", "matplotlib>=3.4", "pandas>=1.3"]
ml = ["ultralytics>=8.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
agribot = "agribot.app.main:main"
agribot-sim = "agribot.app.simulate:main"
agribot-preflight = "agribot.app.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running simulation tests",
    "hardware: requires physical robot hardware",
    "ml: requires ultralytics/torch",
]
filterwarnings = ["ignore::DeprecationWarning"]
